# RA2_RL 持续集成（Agent-10 维护）
#
# 只跑 unit marker（pyproject addopts 已带 -m unit）与 ruff 静态检查；
# integration/trackb 靠 marker 隔离，绝不进 CI（无 Docker server / 真实游戏）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit + lint (py3.10 / windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # 对齐 venv A（agents/README.md §6）

      - name: Install dev deps
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff, report only)
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest
